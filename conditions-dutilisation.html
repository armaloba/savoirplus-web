<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conditions d'utilisation — Savoir+ LMS</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <style>
    :root {
      --sp-blue:      #1565C0;
      --sp-blue-dark: #0D47A1;
      --sp-bg:        #F4F6F9;
      --sp-text:      #1A1A2E;
    }

    body { font-family: 'Inter', sans-serif; color: var(--sp-text); background: #fff; }

    /* Navbar */
    .sp-navbar { background: linear-gradient(135deg, #1565C0 0%, #1976D2 60%, #2196F3 100%); padding: 0.75rem 0; }

    .sp-logo {
      display: inline-flex; align-items: center; gap: 0.55rem;
      color: #fff; text-decoration: none;
      font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
    }
    .sp-logo:hover { color: rgba(255,255,255,0.85); }
    .sp-logo i { font-size: 1.65rem; }
    .sp-logo .sp-lms { font-size: 0.85rem; font-weight: 500; opacity: 0.8; letter-spacing: 0.05em; margin-top: 5px; }

    .btn-login {
      background: #fff; color: var(--sp-blue); border: none; border-radius: 8px;
      padding: 0.5rem 1.25rem; font-weight: 700; font-size: 0.9rem;
      text-decoration: none; transition: background 0.2s, color 0.2s;
    }
    .btn-login:hover { background: #e8f0fe; color: var(--sp-blue-dark); }

    .btn-nav-contact {
      background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.6);
      border-radius: 8px; padding: 0.45rem 1.1rem; font-weight: 600; font-size: 0.9rem;
      text-decoration: none; transition: border-color 0.2s, background 0.2s;
    }
    .btn-nav-contact:hover { border-color: #fff; background: rgba(255,255,255,0.12); color: #fff; }

    /* Page content */
    .page-header {
      background: var(--sp-bg);
      border-bottom: 1px solid #e2e9f4;
      padding: 3.5rem 0 2.5rem;
    }

    .page-header h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: -0.03em; }
    .page-header p { color: #64748b; font-size: 1rem; margin: 0; }

    .page-body { padding: 4rem 0 6rem; min-height: 40vh; }

    .coming-soon {
      text-align: center;
      padding: 4rem 2rem;
      color: #94a3b8;
    }
    .coming-soon i { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .coming-soon p { font-size: 1rem; margin: 0; }

    /* Footer */
    .sp-footer { background: var(--sp-text); color: rgba(255,255,255,0.6); padding: 2rem 0; font-size: 0.875rem; }
    .sp-footer a { color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s; }
    .sp-footer a:hover { color: #fff; }
    .social-links { display: flex; gap: 0.5rem; }
    .social-btn { width:34px; height:34px; border-radius:8px; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6); display:flex; align-items:center; justify-content:center; font-size:1rem; text-decoration:none; transition:background 0.2s,color 0.2s; }
    .social-btn:hover { background:rgba(255,255,255,0.18); color:#fff; }
  </style>
</head>
<body>

  <nav class="sp-navbar sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="sp-logo">
        <i class="bi bi-mortarboard-fill"></i>
        Savoir+&nbsp;<span class="sp-lms">LMS</span>
      </a>
      <a href="index.html#demo" class="btn-nav-contact">Contact</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb" style="font-size:0.85rem;">
          <li class="breadcrumb-item"><a href="index.html" style="color:var(--sp-blue);text-decoration:none;">Accueil</a></li>
          <li class="breadcrumb-item active">Conditions d'utilisation</li>
        </ol>
      </nav>
      <h1>Conditions d'utilisation</h1>
      <p>Dernière mise à jour : mai 2026</p>
    </div>
  </div>

  <div class="page-body">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="coming-soon">
            <i class="bi bi-file-earmark-text"></i>
            <p>Cette page est en cours de rédaction.<br />Revenez bientôt.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="sp-footer">
    <div class="container">
      <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3">
        <span>&copy; 2026 Savoir+. Tous droits réservés.</span>
        <div class="social-links">
          <a href="#" class="social-btn" title="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#" class="social-btn" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
          <a href="#" class="social-btn" title="X / Twitter"><i class="bi bi-twitter-x"></i></a>
          <a href="#" class="social-btn" title="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" class="social-btn" title="YouTube"><i class="bi bi-youtube"></i></a>
        </div>
        <div class="d-flex gap-3">
          <a href="politique-de-confidentialite.html">Politique de confidentialité</a>
          <a href="conditions-dutilisation.html">Conditions d'utilisation</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
